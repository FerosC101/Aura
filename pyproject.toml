[project]
name = "aura-engine"
version = "0.1.0"
description = "AURA - AI-Powered Selective Awareness. Hear what matters. Silence what doesn't."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "AURA Team" }]
keywords = ["audio", "semantic-hearing", "dsp", "real-time", "accessibility"]

# Core runtime: intentionally light. The AURA Engine runs end-to-end with
# NumPy + SciPy + PortAudio only. Every AI backend is an optional plug-in
# behind an abstract interface (see aura.classification.base, etc.).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "websockets>=12.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Neural sound-event classification backends (YAMNet / PANNs / AST via ONNX).
onnx = ["onnxruntime>=1.17", "librosa>=0.10"]
# Torch-based separation (Demucs / Conv-TasNet) and ECAPA-TDNN speaker embeddings.
torch = ["torch>=2.2", "torchaudio>=2.2"]
speaker = ["speechbrain>=1.0"]
# Name Awareness via on-device ASR.
asr = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]
all = [
    "aura-engine[onnx,torch,speaker,asr,dev]",
]

[project.scripts]
aura = "aura.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.ruff.lint.per-file-ignores]
# Optional lifecycle hooks on abstract bases are intentionally empty and
# intentionally not abstract: a backend that has nothing to warm up or release
# should not be forced to write a stub.
"src/aura/classification/base.py" = ["B027"]
"src/aura/separation/base.py" = ["B027"]
"src/aura/speaker/base.py" = ["B027"]
"src/aura/speech/name_awareness.py" = ["B027"]
# Benchmark scripts must extend sys.path before importing the package.
"scripts/*" = ["E402"]
